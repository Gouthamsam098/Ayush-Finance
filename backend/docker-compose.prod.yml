# ──────────────────────────────────────────────────────────────────────────
# PRODUCTION stack — Anush LMS
#
#   Caddy (TLS, :80/:443)  →  web (nginx, static SPA)      internal only
#                          →  backend (Go API)             internal only
#                                    ↓
#                             postgres                     internal only
#
# Differences from the development docker-compose.yml (all deliberate):
#   • APP_ENV=production  — activates the config guards (no wildcard CORS, an
#     explicit origin allowlist is REQUIRED or the process refuses to boot).
#   • NO hardcoded credentials. Every secret comes from the environment via
#     `${VAR:?...}`, which makes docker compose FAIL FAST with a clear message
#     if the value is missing — you cannot accidentally deploy dev defaults.
#   • Postgres publishes NO host port. It is reachable only over the internal
#     Docker network, so the database is not exposed to the internet.
#   • Caddy is the only service with published ports (80/443).
#   • restart: unless-stopped on every service.
#   • Log rotation caps so container logs cannot fill the droplet's disk.
#
# Usage (from backend/):
#   cp .env.production.example .env.production
#   # fill in every value, then:
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# The build context is the REPO ROOT (..) because the frontend image is built
# from the root Dockerfile.
# ──────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — generate a strong random value}
      # Keep the DB clock aligned with the app: loan/collection dates are
      # local-calendar based (Asia/Kolkata).
      TZ: ${TZ:-Asia/Kolkata}
    # NO `ports:` — the database must never be reachable from the internet.
    # For maintenance use `docker compose exec postgres psql` or an SSH tunnel.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Nightly dumps land here; back this directory up off-droplet.
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      APP_ENV: production
      PORT: "4000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-Asia/Kolkata}

      # In production this MUST be the real frontend origin (e.g.
      # https://lms.example.com). A wildcard is rejected by config.validate().
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required in production (no wildcards)}

      # sslmode=disable is acceptable ONLY because Postgres is on the same
      # internal Docker network and never leaves the host. Switch to
      # sslmode=require if you move to a managed/remote database.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-25}
      DATABASE_MIN_CONNS: ${DATABASE_MIN_CONNS:-2}

      JWT_PRIVATE_KEY_PATH: /app/secrets/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /app/secrets/jwt_public.pem
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-1h}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-0}
      JWT_ISSUER: ${JWT_ISSUER:-anush-lms}

      BCRYPT_COST: ${BCRYPT_COST:-12}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}

      # Bootstrap admin. Set these for the FIRST boot only, then remove them
      # from the env file and rotate the password from inside the app.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-}
    volumes:
      # RS256 keypair, generated on first boot and persisted. Losing this volume
      # invalidates every issued token (all users must log in again).
      - jwt_keys:/app/secrets
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [internal]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  web:
    build:
      # Repo root — the frontend Dockerfile and src/ live there.
      context: ..
      dockerfile: Dockerfile
      args:
        VITE_USE_API: "true"
        # Same-origin API path; Caddy proxies /api to the backend.
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    networks: [internal]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web, backend]
    # The ONLY publicly exposed ports in the stack.
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Domain Caddy will obtain a Let's Encrypt certificate for.
      DOMAIN: ${DOMAIN:?DOMAIN is required (e.g. lms.example.com)}
      # Email for certificate expiry notices.
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certificates — persist or you will hit LE rate limits
      - caddy_config:/config
    networks: [internal]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  postgres_data:
  jwt_keys:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
