# Full local stack: PostgreSQL + the Go backend, both in Docker.
# Run everything with:  docker compose up --build
#
# The backend container generates its JWT keys on first boot, seeds a bootstrap
# admin from the ADMIN_* vars below, and applies DB migrations automatically —
# so a fresh clone is up with a single command.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: anush_lms
      POSTGRES_USER: anush_admin
      # Local-only password; production uses managed secrets, never this file.
      POSTGRES_PASSWORD: dev_password
    # Host 5433 → container 5432. Uses 5433 on the host to avoid clashing with
    # a local PostgreSQL that may already own 5432. The backend reaches the DB
    # over the internal Docker network, so this only affects host-side access.
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anush_admin -d anush_lms"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      PORT: "4000"
      LOG_LEVEL: info
      # The app is India-local by design (all dates are IST calendar days). The
      # backend derives "today" from its own clock, so it must run in IST or a
      # loan/collection dated today (IST) is wrongly rejected as "in the future"
      # during the UTC-evening hours.
      TZ: Asia/Kolkata
      # Frontend dev-server origins allowed by CORS (Vite may pick 5173–5175).
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:5175
      # 'postgres' is the compose service hostname on the internal network.
      DATABASE_URL: postgres://anush_admin:dev_password@postgres:5432/anush_lms?sslmode=disable
      DATABASE_MAX_CONNS: "25"
      DATABASE_MIN_CONNS: "2"
      DATABASE_MAX_CONN_LIFETIME: 1h
      # Keys are generated into this volume on first boot.
      JWT_PRIVATE_KEY_PATH: /app/secrets/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /app/secrets/jwt_public.pem
      JWT_ACCESS_TTL: 1h
      JWT_REFRESH_TTL: "0"
      JWT_ISSUER: anush-lms
      BCRYPT_COST: "12"
      AUTH_RATE_LIMIT_PER_MINUTE: "10"
      API_RATE_LIMIT_PER_MINUTE: "600"
      # Bootstrap admin (change before any real deployment).
      ADMIN_EMAIL: admin@anushcapitals.com
      # Local dev only. NOT a real credential: the live admin password was
      # rotated out of this file because a secret committed to git is
      # compromised. Override per-machine via the shell/.env, never by
      # writing a working password back into this tracked file.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-CHANGE_ME_local_dev_only}
      ADMIN_FULL_NAME: Admin User
    volumes:
      - backend_secrets:/app/secrets
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  backend_secrets:
