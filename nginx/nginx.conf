# ──────────────────────────────────────────────────────────────────────────
# nginx config for the Anush LMS SPA (production).
#
# Serves the built Vite bundle on :8080 (unprivileged port so the container can
# run as non-root). TLS is terminated UPSTREAM by the reverse proxy (Caddy) —
# this server only ever sees plain HTTP on the internal Docker network.
# ──────────────────────────────────────────────────────────────────────────

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never advertise the nginx version.
    server_tokens off;

    # ── Security headers ──────────────────────────────────────────────────
    # HSTS is deliberately NOT set here — it belongs on the TLS terminator
    # (Caddy), which knows the request actually arrived over HTTPS.
    #
    # CSP: the app is a self-contained SPA — all JS/CSS is same-origin. Two
    # unsafe- directives are required by the current stack and are the ONLY
    # relaxations: 'unsafe-inline' for styles (Tailwind/Framer Motion inject
    # inline style attributes) and blob: for img/frame (document previews are
    # rendered from blob: URLs created by documentApi). If the document preview
    # is ever moved to a sandboxed iframe with a server-set Content-Type, the
    # frame-src blob: can be dropped.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # ── Compression ───────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml image/svg+xml
               application/wasm font/woff font/woff2;

    # Upload ceiling must be >= the backend's 5 MB document limit, with headroom
    # for multipart overhead. Keeping it tight here rejects oversized uploads at
    # the edge instead of streaming them to the API.
    client_max_body_size 8m;

    # ── Static assets: content-hashed by Vite, so cache hard ───────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Images/fonts at the root (logos etc.) — hashed less reliably, cache short.
    location ~* \.(?:png|jpe?g|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public" always;
        access_log off;
        try_files $uri =404;
    }

    # ── SPA history fallback ──────────────────────────────────────────────
    # index.html must NEVER be cached: it references the hashed bundles, so a
    # stale copy pins users to a deleted asset after a deploy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Container-level liveness (Caddy/compose healthcheck target).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Deny dotfiles (.env, .git, …) if any ever land in the web root.
    location ~ /\. {
        deny all;
        return 404;
    }
}
