# ── Security headers for the SPA ─────────────────────────────────────────
# Included in the server block AND in every location that sets its own
# add_header: nginx drops all inherited add_header lines in any block that
# declares one, so a server-level-only copy is silently missing from the pages
# and assets that actually reach the browser.
#
# HSTS is deliberately NOT set here — it belongs on the TLS terminator (Caddy),
# which knows the request actually arrived over HTTPS.
#
# CSP: the app is a self-contained SPA — all JS/CSS is same-origin. Two
# relaxations are required by the current stack and are the ONLY ones:
# 'unsafe-inline' for styles (Tailwind/Framer Motion inject inline style
# attributes) and blob: for img/frame (document previews are rendered from blob:
# URLs created by documentApi). If the document preview is ever moved to a
# sandboxed iframe with a server-set Content-Type, the frame-src blob: can go.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
